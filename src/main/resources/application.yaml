spring:
  application:
    name: ifs25025-p5-pbo2026-springboot-cashflow
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
    livereload:
      enabled: true

server:
  port: ${APP_PORT:${PORT:8080}}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types:
      - text/html
      - text/xml
      - text/plain
      - text/css
      - text/javascript
      - application/javascript
      - application/json
      - application/xml
      - image/svg+xml
  servlet:
    session:
      timeout: 8h
      cookie:
        name: CASHFLOWSESSION
        http-only: true

app:
  root-username: ${ROOT_USERNAME}
  root-password: ${ROOT_PASSWORD}
  upload-dir: ${UPLOAD_DIR:uploads}

vaadin:
  launch-browser: false
  liveReload:
    enabled: true
